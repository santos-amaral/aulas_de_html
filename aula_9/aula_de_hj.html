<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula de hoje</title>

    <!-- Bootstrap 5.3.3 (Versão Estável) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        /* Estilo aplicado apenas nas caixas com a classe .caixa-exemplo */
        .caixa-exemplo {
            background-color: lightblue;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Primeiro bloco com bordas e flexbox -->
    <div class="container border border-2 rounded-4 py-5 d-flex justify-content-around my-4">
        <div class="border border-warning rounded-3 p-3 bg-light">Bloco 1</div>
        <div class="border border-danger rounded-3 p-3 bg-light">Bloco 2</div>
        <div class="border border-black rounded-3 p-3 bg-light">Bloco 3</div>
    </div>

    <!-- Segundo bloco com exemplo de Box Model -->
    <div class="container">
        <div class="caixa-exemplo rounded-3">
            <h3>Exemplo de box model</h3>
            <div class="bg-white p-3 rounded">
                <p class="mb-0">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Vitae earum porro, velit temporibus libero voluptatum qui perspiciatis natus nihil facere unde accusantium maiores blanditiis fugit molestiae delectus illo architecto accusamus.</p>
            </div>
        </div>
    </div>

    <!-- Script do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
